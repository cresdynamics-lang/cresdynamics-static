# Per-site access log format for cresdynamics.com (behind Cloudflare).
# Records the real visitor IP, host and country so traffic can be measured
# separately from the other sites on this server. Rotated daily, 14 days kept.
log_format cres '$http_cf_connecting_ip $remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time cc=$http_cf_ipcountry';
