server {
    server_name cresdynamics.com www.cresdynamics.com;
    client_max_body_size 25m;
    access_log /var/log/nginx/cresdynamics.access.log cres;
    access_log /var/log/nginx/access.log;

    location ~ ^/(api/careers/apply|api/events/speakers/apply|api/events/sponsors/apply)$ {
        limit_req zone=post_limit burst=5 nodelay;
        limit_req zone=apply_limit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cresdynamics.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cresdynamics.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.cresdynamics.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cresdynamics.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cresdynamics.com www.cresdynamics.com;
    return 404; # managed by Certbot




}