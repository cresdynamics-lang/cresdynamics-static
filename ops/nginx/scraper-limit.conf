## Scraper rate limit (added 2026-11-24 after nginx ran out of worker connections)
## A Python "aiohttp" scraper made ~79% of requests across all sites. Each scraping
## IP is limited to 30 requests a minute; everyone else has an empty key and is
## never limited. Server/location blocks with their own limit_req keep theirs.
map $http_user_agent $scraper_key {
    default            "";
    "~*aiohttp"        $binary_remote_addr;
    "~*python-requests" $binary_remote_addr;
    "~*scrapy"         $binary_remote_addr;
}
limit_req_zone $scraper_key zone=scrapers:10m rate=30r/m;
limit_req zone=scrapers burst=10 nodelay;
