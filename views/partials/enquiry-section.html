<!-- ENQUIRY (shared, service pages) -->
<section class="section-light enquiry-section" id="enquire" aria-labelledby="enquire-title">
  <div class="section-container enquiry-layout">
    <div class="enquiry-intro">
      <span class="eyebrow">Start a project</span>
      <h2 class="section-title" id="enquire-title">Tell us what you need built.</h2>
      <p class="section-subtitle">A senior engineer reads every enquiry and replies within 2 hours during working hours (Mon–Fri, 8:00–18:00 EAT).</p>
      <div class="enquiry-alt">
        <a class="btn btn-secondary" href="{{bookingUrl}}" target="_blank" rel="noopener noreferrer">Book a 30-minute call</a>
        <a class="btn btn-ghost" href="https://wa.me/254708805496?text=Hi%2C%20I%27d%20like%20to%20discuss%20a%20project%20with%20Cres%20Dynamics." target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>
      </div>
      <p class="enquiry-note">Prefer email? <span>info@cresdynamics.com</span> · Call <span>+254 708 805 496</span></p>
    </div>
    <form class="form-stack enquiry-form" data-enquiry novalidate>
{{enquiryFields}}
    </form>
  </div>
</section>
