<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link">Dashboard</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link">Blog</a>
      <a href="/admin/applications" class="sidebar-link active">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link">Messages</a>
      <a href="/admin/payments" class="sidebar-link">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>
  
  <main class="admin-main">
    <div class="admin-header">
      <h1>Career Applications</h1>
    </div>
    
    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Phone</th>
            <th>CV</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="applications-table">
          <tr>
            <td colspan="6" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/admin/me');
      if (!response.ok) {
        window.location.href = '/admin/login';
        return false;
      }
      return true;
    } catch {
      window.location.href = '/admin/login';
      return false;
    }
  }
  
  async function loadApplications() {
    if (!await checkAuth()) return;
    
    try {
      const response = await fetch('/api/admin/applications');
      const applications = await response.json();
      
      const tbody = document.getElementById('applications-table');
      
      if (applications.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No applications found</td></tr>';
        return;
      }
      
      tbody.innerHTML = applications.map(app => `
        <tr>
          <td>${app.name}</td>
          <td>${app.role}</td>
          <td>${app.email}</td>
          <td>${app.phone}</td>
          <td>${app.cvFileName ? app.cvFileName : '-'}</td>
          <td>${new Date(app.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load applications:', err);
    }
  }
  
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  
  loadApplications();
</script>
