<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link active">Dashboard</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link">Blog</a>
      <a href="/admin/applications" class="sidebar-link">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link">Messages</a>
      <a href="/admin/payments" class="sidebar-link">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>
  
  <main class="admin-main">
    <div class="admin-header">
      <h1>Dashboard</h1>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Events</h3>
        <p class="stat-count" id="events-count">-</p>
        <a href="/admin/events" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Messages</h3>
        <p class="stat-count" id="messages-count">-</p>
        <a href="/admin/messages" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Careers</h3>
        <p class="stat-count" id="careers-count">-</p>
        <a href="/admin/applications" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Speakers</h3>
        <p class="stat-count" id="speakers-count">-</p>
        <a href="/admin/speakers" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Sponsors</h3>
        <p class="stat-count" id="sponsors-count">-</p>
        <a href="/admin/sponsors" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Payments</h3>
        <p class="stat-count" id="payments-count">-</p>
        <a href="/admin/payments" class="stat-link">View All</a>
      </div>
      <div class="stat-card">
        <h3>Blog</h3>
        <p class="stat-count" id="blog-count">-</p>
        <a href="/admin/blog" class="stat-link">View All</a>
      </div>
    </div>
  </main>
</div>

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/admin/me');
      if (!response.ok) {
        window.location.href = '/admin/login';
        return false;
      }
      return true;
    } catch {
      window.location.href = '/admin/login';
      return false;
    }
  }
  
  async function loadDashboard() {
    if (!await checkAuth()) return;
    
    try {
      const response = await fetch('/api/admin/dashboard');
      const data = await response.json();
      
      document.getElementById('events-count').textContent = data.events || 0;
      document.getElementById('messages-count').textContent = data.messages || 0;
      document.getElementById('careers-count').textContent = data.careers || 0;
      document.getElementById('speakers-count').textContent = data.speakers || 0;
      document.getElementById('sponsors-count').textContent = data.sponsors || 0;
      document.getElementById('payments-count').textContent = data.payments || 0;
      document.getElementById('blog-count').textContent = data.blog || 0;
    } catch (err) {
      console.error('Failed to load dashboard:', err);
    }
  }
  
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  
  loadDashboard();
</script>
