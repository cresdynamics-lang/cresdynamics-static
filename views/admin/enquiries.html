<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link">Dashboard</a>
      <a href="/admin/enquiries" class="sidebar-link active">Enquiries</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link">Blog</a>
      <a href="/admin/applications" class="sidebar-link">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link">Messages</a>
      <a href="/admin/payments" class="sidebar-link">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Website Enquiries</h1>
      <label class="enq-toggle"><input type="checkbox" id="show-spam"> Show filtered spam</label>
    </div>
    <p class="admin-hint" id="spam-note"></p>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Received</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Needs</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="enquiries-table">
          <tr><td colspan="5" class="loading">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function loadEnquiries() {
    const all = document.getElementById('show-spam').checked;
    const tbody = document.getElementById('enquiries-table');
    try {
      const res = await fetch('/api/admin/enquiries' + (all ? '?all=1' : ''));
      if (res.status === 401 || res.redirected) { window.location.href = '/admin/login'; return; }
      const data = await res.json();
      document.getElementById('spam-note').textContent = data.hiddenSpam
        ? data.hiddenSpam.toLocaleString() + ' submissions match known spam patterns and are ' + (all ? 'shown, marked Spam.' : 'hidden. Nothing has been deleted.')
        : '';
      if (!data.rows || !data.rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No enquiries yet</td></tr>';
        return;
      }
      tbody.innerHTML = data.rows.map(function (r) {
        return '<tr>' +
          '<td>' + esc(new Date(r.createdAt).toLocaleString()) + (r.likelySpam ? ' <span class="status-badge danger">Spam</span>' : '') + '</td>' +
          '<td>' + esc(r.name) + '</td>' +
          '<td>' + esc(r.email) + '<br><span class="message-preview">' + esc(r.phone) + '</span></td>' +
          '<td>' + esc(r.service) + '</td>' +
          '<td class="message-preview" style="white-space:pre-line;">' + esc(r.detail) + '</td>' +
        '</tr>';
      }).join('');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load enquiries. Refresh to try again.</td></tr>';
    }
  }
  document.getElementById('show-spam').addEventListener('change', loadEnquiries);
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  loadEnquiries();
</script>
