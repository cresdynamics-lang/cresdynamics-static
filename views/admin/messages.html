<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link">Dashboard</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link">Blog</a>
      <a href="/admin/applications" class="sidebar-link">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link active">Messages</a>
      <a href="/admin/payments" class="sidebar-link">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>
  
  <main class="admin-main">
    <div class="admin-header">
      <h1>Chat Messages</h1>
    </div>
    
    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Last Message</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="messages-table">
          <tr>
            <td colspan="5" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/admin/me');
      if (!response.ok) {
        window.location.href = '/admin/login';
        return false;
      }
      return true;
    } catch {
      window.location.href = '/admin/login';
      return false;
    }
  }
  
  async function loadMessages() {
    if (!await checkAuth()) return;
    
    try {
      const response = await fetch('/api/admin/messages');
      const messages = await response.json();
      
      const tbody = document.getElementById('messages-table');
      
      if (messages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No messages found</td></tr>';
        return;
      }
      
      tbody.innerHTML = messages.map(m => `
        <tr>
          <td>${m.name}</td>
          <td>${m.phone}</td>
          <td>${m.email}</td>
          <td class="message-preview">${m.lastMessage}</td>
          <td>${new Date(m.updatedAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load messages:', err);
    }
  }
  
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  
  loadMessages();
</script>
