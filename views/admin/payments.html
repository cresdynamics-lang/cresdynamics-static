<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link">Dashboard</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link">Blog</a>
      <a href="/admin/applications" class="sidebar-link">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link">Messages</a>
      <a href="/admin/payments" class="sidebar-link active">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>
  
  <main class="admin-main">
    <div class="admin-header">
      <h1>Payments</h1>
    </div>
    
    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Source</th>
            <th>Reference</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Purpose</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="payments-table">
          <tr>
            <td colspan="6" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/admin/me');
      if (!response.ok) {
        window.location.href = '/admin/login';
        return false;
      }
      return true;
    } catch {
      window.location.href = '/admin/login';
      return false;
    }
  }
  
  async function loadPayments() {
    if (!await checkAuth()) return;
    
    try {
      const response = await fetch('/api/admin/payments');
      const payments = await response.json();
      
      const tbody = document.getElementById('payments-table');
      
      if (payments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No payments found</td></tr>';
        return;
      }
      
      tbody.innerHTML = payments.map(p => `
        <tr>
          <td>${p.source}</td>
          <td>${p.reference}</td>
          <td>${p.currency || 'KES'} ${(p.amount || 0).toLocaleString()}</td>
          <td><span class="status-badge status-${p.status}">${p.status}</span></td>
          <td>${p.purpose}</td>
          <td>${new Date(p.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load payments:', err);
    }
  }
  
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  
  loadPayments();
</script>
