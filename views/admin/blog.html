<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>CRES Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link">Dashboard</a>
      <a href="/admin/events" class="sidebar-link">Events</a>
      <a href="/admin/blog" class="sidebar-link active">Blog</a>
      <a href="/admin/applications" class="sidebar-link">Applications</a>
      <a href="/admin/speakers" class="sidebar-link">Speakers</a>
      <a href="/admin/sponsors" class="sidebar-link">Sponsors</a>
      <a href="/admin/messages" class="sidebar-link">Messages</a>
      <a href="/admin/payments" class="sidebar-link">Payments</a>
    </nav>
    <button class="sidebar-logout" onclick="logout()">Logout</button>
  </aside>
  
  <main class="admin-main">
    <div class="admin-header">
      <h1>Blog Management</h1>
      <a href="/admin/blog-editor" class="btn btn-primary">New Post</a>
    </div>
    
    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Slug</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="posts-table">
          <tr>
            <td colspan="4" class="loading">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  async function checkAuth() {
    try {
      const response = await fetch('/api/admin/me');
      if (!response.ok) {
        window.location.href = '/admin/login';
        return false;
      }
      return true;
    } catch {
      window.location.href = '/admin/login';
      return false;
    }
  }
  
  async function loadPosts() {
    if (!await checkAuth()) return;
    
    try {
      const response = await fetch('/api/admin/blog');
      const posts = await response.json();
      
      const tbody = document.getElementById('posts-table');
      
      if (posts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No posts found</td></tr>';
        return;
      }
      
      tbody.innerHTML = posts.map(post => `
        <tr>
          <td>${post.title}</td>
          <td>${post.slug}</td>
          <td><span class="status-badge ${post.published ? 'published' : 'draft'}">${post.published ? 'Published' : 'Draft'}</span></td>
          <td class="actions">
            <a href="/admin/blog-editor?id=${post.id}" class="action-btn">Edit</a>
            <button onclick="togglePublish(${post.id}, ${post.published})" class="action-btn">${post.published ? 'Unpublish' : 'Publish'}</button>
            <a href="/blog/${post.slug}" target="_blank" class="action-btn">View</a>
            <button onclick="deletePost(${post.id})" class="action-btn danger">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load posts:', err);
    }
  }
  
  async function togglePublish(id, currentlyPublished) {
    try {
      await fetch(`/api/admin/blog/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ published: !currentlyPublished })
      });
      loadPosts();
    } catch (err) {
      console.error('Failed to update post:', err);
    }
  }
  
  async function deletePost(id) {
    if (!confirm('Are you sure you want to delete this post?')) return;
    
    try {
      await fetch(`/api/admin/blog/${id}`, { method: 'DELETE' });
      loadPosts();
    } catch (err) {
      console.error('Failed to delete post:', err);
    }
  }
  
  function logout() {
    fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  }
  
  loadPosts();
</script>
