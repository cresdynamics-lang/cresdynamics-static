<!-- Blog Hero Section -->
<section class="hero-section" style="min-height:60vh;background:linear-gradient(135deg,#F9FAFB 0%,#fff 100%);color:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(47,166,179,0.08) 0%,transparent 50%),radial-gradient(circle at 70% 30%,rgba(243,156,36,0.06) 0%,transparent 50%);"></div>
  <div style="position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:80px 24px;width:100%;text-align:center;">
    <span style="display:inline-block;font-size:13px;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:var(--teal-accent);margin-bottom:16px;animation:fadeInUp 0.8s ease-out;">Insights & Strategy</span>
    <h1 style="font-size:clamp(2rem,5vw,3.5rem);font-weight:900;line-height:1.15;color:#000;margin-bottom:1.5rem;letter-spacing:-0.02em;">
      Building Better <span style="position:relative;display:inline-block;padding-bottom:0.15em;background-image:linear-gradient(90deg,transparent 0%,rgba(243,156,36,0.9) 8%,rgba(47,166,179,0.9) 50%,rgba(243,156,36,0.9) 92%,transparent 100%);background-size:100% 4px;background-position:0 100%;background-repeat:no-repeat;">Systems</span>
    </h1>
    <p style="font-size:clamp(1rem,2vw,1.25rem);color:rgba(0,0,0,0.7);max-width:700px;line-height:1.8;margin:0 auto;">
      Real insights from our projects. Learn how we build systems that scale across branches, integrate departments, and drive measurable results.
    </p>
  </div>
</section>

<!-- Blog Grid Section -->
<section class="section-light" style="padding:100px 24px;">
  <div class="section-container" style="max-width:1200px;margin:0 auto;">
    <div id="blog-grid" class="blog-grid"></div>
    <div id="no-posts" style="text-align:center;padding:60px 20px;display:none;">
      <p style="font-size:18px;color:rgba(0,0,0,0.6);">No blog posts published yet. Check back soon for insights and updates.</p>
    </div>
  </div>
</section>

<script>
  const postsData = JSON.parse('{{posts}}');
  const grid = document.getElementById('blog-grid');
  const noPosts = document.getElementById('no-posts');
  
  if (!postsData || postsData.length === 0) {
    noPosts.style.display = 'block';
  } else {
    postsData.forEach((post, index) => {
      const card = document.createElement('div');
      card.className = 'blog-card';
      card.style.animationDelay = (index * 100) + 'ms';
      
      const date = post.published_at ? new Date(post.published_at).toLocaleDateString('en-KE', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      }) : '';
      
      card.innerHTML = `
        <a href="/blog/${post.slug}" class="blog-card-link">
          <div class="blog-card-header">
            <span class="blog-card-category">${post.category || 'Article'}</span>
            <span class="blog-card-date">${date}</span>
          </div>
          <h3 class="blog-card-title">${post.title}</h3>
          <p class="blog-card-excerpt">${post.excerpt || 'Read more...'}</p>
          <div class="blog-card-footer">
            <span class="blog-card-cta">Read Article →</span>
          </div>
        </a>
      `;
      grid.appendChild(card);
    });
  }
</script>

<style>
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 32px;
    animation: fadeInUp 0.8s ease-out;
  }

  .blog-card {
    background: linear-gradient(135deg, #fff 0%, #F9FAFB 100%);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.22,0.61,0.36,1);
    position: relative;
    animation: fadeInUp 0.8s ease-out both;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .blog-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(243,156,36,0.03) 0%, rgba(47,166,179,0.03) 100%);
    opacity: 0;
    transition: opacity 0.35s;
    z-index: -1;
  }

  .blog-card:hover {
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
    border-color: var(--teal-accent);
  }

  .blog-card:hover::before {
    opacity: 1;
  }

  .blog-card-link {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 32px 28px;
    text-decoration: none;
    color: inherit;
    transition: all 0.35s;
  }

  .blog-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }

  .blog-card-category {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--orange-energy);
    background: rgba(243,156,36,0.1);
    padding: 6px 12px;
    border-radius: 6px;
    display: inline-block;
    white-space: nowrap;
  }

  .blog-card-date {
    font-size: 12px;
    font-weight: 600;
    color: rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  .blog-card-title {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 900;
    line-height: 1.3;
    color: var(--navy-dark);
    margin: 12px 0 16px 0;
    transition: all 0.35s;
  }

  .blog-card:hover .blog-card-title {
    color: var(--teal-accent);
  }

  .blog-card-excerpt {
    color: rgba(0,0,0,0.6);
    font-size: 14px;
    line-height: 1.7;
    margin: 0;
    flex-grow: 1;
    transition: all 0.35s;
  }

  .blog-card:hover .blog-card-excerpt {
    color: rgba(0,0,0,0.8);
  }

  .blog-card-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .blog-card-cta {
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-accent);
    transition: all 0.35s;
    display: inline-block;
  }

  .blog-card:hover .blog-card-cta {
    color: var(--orange-energy);
    transform: translateX(4px);
  }

  @media (max-width: 768px) {
    .blog-grid {
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .blog-card-link {
      padding: 24px 20px;
    }

    .blog-card-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .blog-card-date {
      width: 100%;
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .blog-card,
    .blog-grid {
      animation: none;
    }

    .blog-card {
      transition: none;
    }
  }
</style>
