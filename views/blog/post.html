<article class="blog-post">
  <div class="container">
    <div class="blog-post-header">
      <span class="eyebrow">{{category}}</span>
      <h1>{{title}}</h1>
      <p class="blog-post-meta">
        <span class="blog-post-author">By {{author}}</span>
        <span class="blog-post-date">{{date}}</span>
      </p>
      <p class="blog-post-excerpt">{{excerpt}}</p>
    </div>
    
    <div class="blog-post-content">
      {{body}}
    </div>
    
    <div class="blog-post-footer">
      <div class="blog-post-share">
        <span>Share this post:</span>
        <a href="https://twitter.com/intent/tweet?text={{title}}&url=https://cresdynamics.com/blog/{{slug}}" target="_blank" class="share-btn">Twitter</a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://cresdynamics.com/blog/{{slug}}" target="_blank" class="share-btn">LinkedIn</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=https://cresdynamics.com/blog/{{slug}}" target="_blank" class="share-btn">Facebook</a>
      </div>
      <a href="/blog" class="back-link">← Back to Blog</a>
    </div>
  </div>
</article>

<style>
  .blog-post {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  .blog-post-header {
    text-align: center;
    margin-bottom: 3rem;
  }
  .blog-post-header .eyebrow {
    color: var(--color-primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .blog-post-header h1 {
    margin: 1rem 0;
    line-height: 1.2;
  }
  .blog-post-meta {
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .blog-post-author {
    margin-right: 1rem;
  }
  .blog-post-excerpt {
    font-size: 1.1rem;
    color: var(--text-secondary);
    margin-top: 1.5rem;
    line-height: 1.6;
  }
  .blog-post-content {
    line-height: 1.8;
  }
  .blog-post-content h2,
  .blog-post-content h3 {
    margin-top: 2rem;
  }
  .blog-post-content p {
    margin-bottom: 1.5rem;
  }
  .blog-post-content img {
    max-width: 100%;
    border-radius: 8px;
    margin: 2rem 0;
  }
  .blog-post-content blockquote {
    border-left: 4px solid var(--color-primary);
    padding-left: 1.5rem;
    margin: 2rem 0;
    font-style: italic;
    color: var(--text-secondary);
  }
  .blog-post-footer {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-color);
  }
  .blog-post-share {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .share-btn {
    padding: 0.5rem 1rem;
    background: var(--bg-secondary);
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-primary);
    font-size: 0.9rem;
    transition: background 0.3s;
  }
  .share-btn:hover {
    background: var(--bg-tertiary);
  }
  .back-link {
    display: inline-block;
    color: var(--color-primary);
    text-decoration: none;
    font-weight: 500;
  }
  .back-link:hover {
    text-decoration: underline;
  }
</style>
