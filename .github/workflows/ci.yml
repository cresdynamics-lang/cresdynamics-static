name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Start server
        env:
          PORT: '3001'
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/cresdynamics'
          fi
          node server.js > /tmp/cres-server.log 2>&1 &
          echo $! > /tmp/cres-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/robots.txt >/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          cat /tmp/cres-server.log || true
          exit 1

      - name: Smoke checks
        env:
          BASE_URL: http://127.0.0.1:3001
        run: node scripts/smoke.js

      - name: Lighthouse gate (soft unless LH_REQUIRE=1)
        env:
          BASE_URL: http://127.0.0.1:3001
          LH_REQUIRE: '0'
        run: |
          npm install --no-save lighthouse chrome-launcher
          node scripts/lighthouse-gate.js || true

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/cres-server.pid ]; then kill $(cat /tmp/cres-server.pid) || true; fi
